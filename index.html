<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClickFR — Phone Accessories, Wellness, Clothing & More</title>
  <meta name="description" content="ClickFR — a modern demo e-commerce store with a full checkout & demo payment flow." />

  <!-- React (CDN, stable) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root{
      --bg:#ffffff;
      --bg-2:#f6f6fb;
      --panel:#ffffff;
      --panel-2:#f4f4f9;
      --line:rgba(18,18,40,.09);
      --line-2:rgba(18,18,40,.15);
      --txt:#16161f;
      --muted:#5e5e72;
      --muted-2:#8a8a9c;
      --brand:#7c5cff;
      --brand-2:#0d9eb8;
      --accent:#ff4d80;
      --good:#12b981;
      --radius:18px;
      --shadow:0 18px 50px -24px rgba(30,25,70,.28);
      --grad:linear-gradient(135deg,#7c5cff 0%,#22d3ee 100%);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg);
      color:var(--txt);
      -webkit-font-smoothing:antialiased;
      line-height:1.5;
      overflow-x:hidden;
    }
    body::before{
      content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
      background:
        radial-gradient(60vw 60vw at 85% -10%,rgba(124,92,255,.10),transparent 60%),
        radial-gradient(50vw 50vw at 0% 10%,rgba(34,211,238,.08),transparent 55%),
        radial-gradient(40vw 40vw at 50% 120%,rgba(255,92,138,.06),transparent 60%);
    }
    #root{position:relative;z-index:1}
    a{color:inherit;text-decoration:none}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
    img{max-width:100%;display:block}
    ::selection{background:rgba(124,92,255,.25)}
    ::-webkit-scrollbar{width:11px;height:11px}
    ::-webkit-scrollbar-thumb{background:#d3d3dd;border-radius:20px;border:3px solid var(--bg)}
    ::-webkit-scrollbar-track{background:transparent}

    .wrap{max-width:1200px;margin:0 auto;padding:0 22px}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:9px;
      padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;
      transition:transform .15s ease,box-shadow .2s ease,background .2s ease,opacity .2s;
      white-space:nowrap;
    }
    .btn:active{transform:translateY(1px) scale(.99)}
    .btn-primary{background:var(--grad);color:#0a0a0f;box-shadow:0 10px 26px -12px rgba(124,92,255,.7)}
    .btn-primary:hover{box-shadow:0 14px 34px -12px rgba(124,92,255,.85);transform:translateY(-1px)}
    .btn-ghost{background:rgba(18,18,40,.05);border:1px solid var(--line-2)}
    .btn-ghost:hover{background:rgba(18,18,40,.09)}
    .btn-block{width:100%}
    .btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
    .pill{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;font-size:12.5px;
      font-weight:600;background:rgba(18,18,40,.04);border:1px solid var(--line)}
    .chip{
      padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;
      background:rgba(18,18,40,.04);border:1px solid var(--line);color:var(--muted);
      transition:all .18s ease;
    }
    .chip:hover{color:var(--txt);border-color:var(--line-2)}
    .chip.active{background:var(--grad);color:#0a0a0f;border-color:transparent}

    /* Header */
    header.nav{
      position:sticky;top:0;z-index:50;
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      background:rgba(255,255,255,.78);border-bottom:1px solid var(--line);
    }
    .nav-inner{display:flex;align-items:center;gap:20px;height:66px}
    .logo{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.5px;font-size:19px}
    .logo .mark{
      width:34px;height:34px;border-radius:10px;background:var(--grad);
      display:grid;place-items:center;color:#0a0a0f;font-weight:900;font-size:18px;
      box-shadow:0 6px 18px -6px rgba(124,92,255,.7);
    }
    .nav-links{display:flex;gap:26px;margin-left:14px}
    .nav-links a{font-size:14.5px;color:var(--muted);font-weight:500;transition:color .18s}
    .nav-links a:hover{color:var(--txt)}
    .nav-right{margin-left:auto;display:flex;align-items:center;gap:12px}
    .cart-btn{position:relative;width:44px;height:44px;border-radius:12px;background:rgba(18,18,40,.05);
      border:1px solid var(--line-2);display:grid;place-items:center;transition:background .18s}
    .cart-btn:hover{background:rgba(18,18,40,.09)}
    .cart-count{
      position:absolute;top:-7px;right:-7px;min-width:21px;height:21px;padding:0 5px;
      border-radius:999px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:800;
      display:grid;place-items:center;border:2px solid var(--bg);
    }

    /* Hero */
    .hero{padding:76px 0 40px;position:relative}
    .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
    .hero h1{font-size:clamp(38px,6vw,68px);line-height:1.02;margin:16px 0 18px;font-weight:800;letter-spacing:-1.5px}
    .hero h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
    .hero p{font-size:17px;color:var(--muted);max-width:480px;margin:0 0 28px}
    .hero-cta{display:flex;gap:13px;flex-wrap:wrap}
    .hero-stats{display:flex;gap:30px;margin-top:38px}
    .hero-stats .s b{font-size:24px;font-weight:800;display:block}
    .hero-stats .s span{font-size:13px;color:var(--muted-2)}
    .hero-visual{
      position:relative;height:420px;border-radius:26px;overflow:hidden;
      background:
        radial-gradient(120% 120% at 80% 10%,rgba(124,92,255,.42),transparent 55%),
        radial-gradient(120% 120% at 10% 90%,rgba(34,211,238,.40),transparent 55%),
        #f1efff;
      border:1px solid var(--line-2);box-shadow:var(--shadow);
      display:grid;place-items:center;
    }
    .hero-visual .float{font-size:190px;filter:drop-shadow(0 30px 40px rgba(60,50,120,.28));animation:bob 5s ease-in-out infinite}
    .hero-visual .badge{
      position:absolute;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);
      border:1px solid var(--line-2);border-radius:14px;padding:12px 15px;
      display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--txt);
    }
    .hero-visual .badge .dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good)}
    .hero-visual .b1{top:26px;left:26px;animation:bob 6s ease-in-out infinite}
    .hero-visual .b2{bottom:26px;right:26px;animation:bob 7s ease-in-out infinite .5s}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

    /* Section head */
    .sec{padding:34px 0}
    .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
    .sec-head h2{font-size:30px;font-weight:800;letter-spacing:-.6px;margin:6px 0 6px}
    .sec-head p{color:var(--muted);margin:0;font-size:15px}
    .eyebrow{font-size:12.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
      background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
    .filters{display:flex;gap:10px;flex-wrap:wrap}

    /* Product grid */
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
    .card{
      background:var(--panel);
      border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
      transition:transform .2s ease,border-color .2s ease,box-shadow .25s ease;
      display:flex;flex-direction:column;
    }
    .card:hover{transform:translateY(-6px);border-color:var(--line-2);box-shadow:var(--shadow)}
    .card .thumb{height:180px;position:relative;display:grid;place-items:center;font-size:78px;overflow:hidden}
    .card .thumb .em{transition:transform .3s ease;filter:drop-shadow(0 14px 18px rgba(0,0,0,.22))}
    .card:hover .thumb .em{transform:scale(1.12) rotate(-4deg)}
    .card .tag{position:absolute;top:12px;left:12px;font-size:11px;font-weight:800;letter-spacing:.5px;color:#16161f;
      padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.6);text-transform:uppercase}
    .card .tag.sale{background:var(--accent);color:#fff;border-color:transparent}
    .card .fav{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;
      background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.6);display:grid;place-items:center;font-size:15px;
      transition:transform .15s,background .2s}
    .card .fav:hover{transform:scale(1.15);background:#fff}
    .card .body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:9px;flex:1}
    .card .cat{font-size:11.5px;color:var(--brand-2);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
    .card h3{font-size:15.5px;font-weight:700;margin:0;line-height:1.3}
    .card .rate{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
    .stars{color:#f0a814;letter-spacing:1px}
    .card .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:4px}
    .price{display:flex;align-items:baseline;gap:8px}
    .price b{font-size:19px;font-weight:800}
    .price s{font-size:13px;color:var(--muted-2)}
    .add{width:42px;height:42px;border-radius:12px;background:var(--grad);color:#0a0a0f;font-size:20px;font-weight:800;
      display:grid;place-items:center;transition:transform .15s,box-shadow .2s;box-shadow:0 8px 20px -10px rgba(124,92,255,.8)}
    .add:hover{transform:translateY(-2px) scale(1.05)}

    /* Features strip */
    .feat{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:8px}
    .feat .f{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;gap:13px;align-items:flex-start;box-shadow:0 6px 20px -18px rgba(30,25,70,.4)}
    .feat .f .ic{font-size:24px}
    .feat .f b{display:block;font-size:14.5px;margin-bottom:3px}
    .feat .f span{font-size:13px;color:var(--muted)}

    /* Deals banner */
    .deals-banner{
      border-radius:22px;padding:38px 40px;border:1px solid var(--line-2);
      background:radial-gradient(120% 140% at 100% 0%,rgba(124,92,255,.20),transparent 55%),
                 radial-gradient(120% 140% at 0% 100%,rgba(34,211,238,.18),transparent 55%),var(--panel);
      display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
      box-shadow:0 14px 40px -26px rgba(30,25,70,.4);
    }

    /* Footer */
    footer{border-top:1px solid var(--line);margin-top:40px;padding:48px 0 30px;color:var(--muted)}
    .foot-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:30px}
    footer h4{color:var(--txt);font-size:14px;margin:0 0 14px}
    footer ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
    footer ul a{font-size:13.5px;color:var(--muted);transition:color .18s}
    footer ul a:hover{color:var(--txt)}
    .foot-bottom{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);
      display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px}

    /* Drawer / Cart */
    .overlay{position:fixed;inset:0;z-index:80;background:rgba(20,18,45,.35);backdrop-filter:blur(3px);
      opacity:0;pointer-events:none;transition:opacity .28s ease}
    .overlay.show{opacity:1;pointer-events:auto}
    .drawer{
      position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);z-index:90;
      background:var(--bg);border-left:1px solid var(--line-2);
      transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);
      display:flex;flex-direction:column;box-shadow:-30px 0 70px -30px rgba(20,18,45,.35);
    }
    .drawer.show{transform:translateX(0)}
    .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line)}
    .drawer-head h3{margin:0;font-size:18px;font-weight:800}
    .x{width:38px;height:38px;border-radius:10px;background:rgba(18,18,40,.05);display:grid;place-items:center;font-size:18px;
      border:1px solid var(--line);transition:background .18s}
    .x:hover{background:rgba(18,18,40,.1)}
    .drawer-body{flex:1;overflow-y:auto;padding:14px 22px}
    .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:100%;
      color:var(--muted);text-align:center;padding:40px}
    .empty .big{font-size:64px;opacity:.55}
    .line{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
    .line .lt{width:64px;height:64px;border-radius:12px;display:grid;place-items:center;font-size:32px;flex-shrink:0;border:1px solid var(--line)}
    .line .li{flex:1;min-width:0}
    .line .li h4{margin:0 0 3px;font-size:14px;font-weight:700}
    .line .li .lc{font-size:12px;color:var(--muted-2)}
    .qty{display:inline-flex;align-items:center;gap:0;margin-top:9px;border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
    .qty button{width:28px;height:28px;font-size:15px;background:rgba(18,18,40,.03);transition:background .15s}
    .qty button:hover{background:rgba(18,18,40,.08)}
    .qty span{width:34px;text-align:center;font-size:13.5px;font-weight:700}
    .line .lp{text-align:right;display:flex;flex-direction:column;justify-content:space-between}
    .line .lp b{font-size:15px}
    .line .lp button{font-size:12px;color:var(--accent);margin-top:auto}
    .line .lp button:hover{text-decoration:underline}
    .drawer-foot{padding:20px 22px;border-top:1px solid var(--line);background:var(--panel-2)}
    .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:9px;color:var(--muted)}
    .row.total{font-size:19px;font-weight:800;color:var(--txt);margin:14px 0 16px;padding-top:14px;border-top:1px solid var(--line)}

    /* Checkout modal */
    .modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;
      opacity:0;pointer-events:none;transition:opacity .25s ease}
    .modal.show{opacity:1;pointer-events:auto}
    .modal:not(.show),.modal:not(.show) *{pointer-events:none}
    .modal .sheet{
      width:min(940px,100%);max-height:92vh;overflow:hidden;border-radius:22px;
      background:var(--bg);border:1px solid var(--line-2);box-shadow:0 30px 80px -30px rgba(20,18,45,.5);
      display:grid;grid-template-columns:1.15fr .85fr;transform:translateY(16px) scale(.98);
      transition:transform .28s cubic-bezier(.4,0,.2,1);
    }
    .modal.show .sheet{transform:none}
    .modal .overlay{z-index:1}
    .modal .sheet{z-index:2}
    .co-form{padding:30px 30px 34px;overflow-y:auto}
    .co-side{background:var(--panel-2);padding:30px;overflow-y:auto;border-left:1px solid var(--line)}
    .co-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
    .co-head h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.4px}
    .steps{display:flex;gap:8px;margin:18px 0 22px}
    .steps .st{flex:1;height:5px;border-radius:999px;background:rgba(18,18,40,.1)}
    .steps .st.on{background:var(--grad)}
    label.fl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 0 7px}
    .inp{
      width:100%;padding:12px 14px;border-radius:11px;background:var(--panel);
      border:1px solid var(--line-2);color:var(--txt);font-size:14.5px;font-family:inherit;
      transition:border-color .18s,box-shadow .18s;
    }
    .inp::placeholder{color:var(--muted-2)}
    .inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(124,92,255,.18)}
    .inp.err{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,77,128,.16)}
    .fg2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .fg3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px}
    .errline{font-size:11.5px;color:var(--accent);margin-top:5px}
    .card-visual{
      position:relative;height:190px;border-radius:18px;padding:22px;margin-bottom:8px;color:#fff;
      background:linear-gradient(135deg,#3a2f70,#1c1740 60%,#122036);
      border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 40px -20px rgba(40,30,90,.6);overflow:hidden;
    }
    .card-visual::after{content:"";position:absolute;top:-40%;right:-10%;width:60%;height:180%;
      background:radial-gradient(circle,rgba(124,92,255,.55),transparent 65%)}
    .card-visual .cv-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
    .card-visual .brand{font-size:13px;font-weight:800;letter-spacing:1px;opacity:.85}
    .card-visual .netw{font-size:15px;font-weight:800;letter-spacing:1px}
    .chip-ic{width:42px;height:30px;border-radius:7px;margin:20px 0 14px;position:relative;z-index:1;
      background:linear-gradient(135deg,#e6c37a,#b8923f);opacity:.9}
    .card-visual .num{font-size:19px;letter-spacing:2.5px;font-family:"SF Mono",ui-monospace,monospace;position:relative;z-index:1}
    .card-visual .cv-bot{display:flex;justify-content:space-between;margin-top:16px;position:relative;z-index:1;font-size:11px}
    .card-visual .cv-bot .lbl{opacity:.6;font-size:9px;letter-spacing:1px;display:block;margin-bottom:3px}
    .card-visual .cv-bot .val{font-size:13px;letter-spacing:1px}
    .pay-methods{display:flex;gap:10px;margin:6px 0 4px}
    .pm{flex:1;padding:11px;border-radius:11px;border:1px solid var(--line-2);background:var(--panel);
      display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:600;transition:all .18s}
    .pm.on{border-color:var(--brand);background:rgba(124,92,255,.10)}
    .pm .pmi{font-size:20px}
    .co-side .ci{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:8px 0;color:var(--muted)}
    .co-side .ci b{color:var(--txt);font-weight:600}
    .secure{display:flex;align-items:center;gap:8px;font-size:12px;color:#0b7a58;margin-top:16px;
      padding:11px 13px;border-radius:11px;background:rgba(18,185,129,.10);border:1px solid rgba(18,185,129,.30)}
    .demo-note{font-size:11.5px;color:var(--muted-2);margin-top:14px;line-height:1.5;text-align:center}
    .spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(10,10,15,.35);border-top-color:#0a0a0f;
      animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* success */
    .success{padding:46px 34px;text-align:center;grid-column:1/-1}
    .success .check{width:96px;height:96px;border-radius:50%;margin:0 auto 22px;display:grid;place-items:center;
      background:radial-gradient(circle,rgba(18,185,129,.22),transparent 70%)}
    .success .check .ring{width:78px;height:78px;border-radius:50%;background:var(--good);display:grid;place-items:center;
      font-size:42px;color:#fff;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
    @keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
    .success h3{font-size:26px;margin:0 0 8px;font-weight:800}
    .success p{color:var(--muted);margin:0 auto 22px;max-width:420px}
    .order-box{max-width:420px;margin:0 auto 24px;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;
      padding:18px;text-align:left}
    .order-box .ci{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;color:var(--muted)}
    .order-box .ci b{color:var(--txt)}

    /* toast */
    .toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:10px;align-items:center}
    .toast{background:#ffffff;border:1px solid var(--line-2);border-radius:12px;padding:12px 18px;
      display:flex;align-items:center;gap:11px;font-size:14px;font-weight:600;box-shadow:0 14px 34px -14px rgba(20,18,45,.4);
      animation:toastIn .3s cubic-bezier(.2,1.2,.4,1)}
    .toast .ti{width:26px;height:26px;border-radius:8px;background:var(--grad);color:#0a0a0f;display:grid;place-items:center;font-size:15px}
    @keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

    /* Responsive */
    @media(max-width:980px){
      .grid{grid-template-columns:repeat(2,1fr)}
      .hero-grid{grid-template-columns:1fr}
      .hero-visual{height:300px;order:-1}
      .modal .sheet{grid-template-columns:1fr}

    /* ---------------- Checkout Modal ---------------- */
    function detectBrand(num){
      const n = num.replace(/\s/g,"");
      if(/^4/.test(n)) return "VISA";
      if(/^5[1-5]/.test(n) || /^2[2-7]/.test(n)) return "MASTERCARD";
      if(/^3[47]/.test(n)) return "AMEX";
      if(/^6/.test(n)) return "DISCOVER";
      return "CARD";
    }
    function Checkout({open,onClose,items,subtotal,shipping,tax,total,onSuccess}){
      const [stage,setStage] = useState("form"); // form | processing | done
      const [method,setMethod] = useState("card");
      const [order,setOrder] = useState(null);
      const [f,setF] = useState({name:"",email:"",address:"",city:"",zip:"",country:"United States",cardName:"",card:"",exp:"",cvc:""});
      const [errs,setErrs] = useState({});

      useEffect(()=>{ if(open){ setStage("form"); setErrs({}); } },[open]);

      const set = (k,v)=> setF(s=>({...s,[k]:v}));
      const onCard = v => {
        let d = v.replace(/\D/g,"").slice(0,16);
        set("card", d.replace(/(.{4})/g,"$1 ").trim());
      };
      const onExp = v => {
        let d = v.replace(/\D/g,"").slice(0,4);
        if(d.length>=3) d = d.slice(0,2)+"/"+d.slice(2);
        set("exp", d);
      };
      const onCvc = v => set("cvc", v.replace(/\D/g,"").slice(0,4));
      const brand = detectBrand(f.card);

      const validate = () => {
        const e={};
        if(!f.name.trim()) e.name="Enter your full name";
        if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)) e.email="Enter a valid email";
        if(!f.address.trim()) e.address="Enter your address";
        if(!f.city.trim()) e.city="Required";
        if(!f.zip.trim()) e.zip="Required";
        if(method==="card"){
          if(!f.cardName.trim()) e.cardName="Name on card required";
          if(f.card.replace(/\s/g,"").length<15) e.card="Enter a valid card number";
          if(!/^\d{2}\/\d{2}$/.test(f.exp)) e.exp="MM/YY";
          if(f.cvc.length<3) e.cvc="CVC";
        }
        setErrs(e);
        return Object.keys(e).length===0;
      };

      const pay = () => {
        if(!validate()) return;
        setStage("processing");
        setTimeout(()=>{
          const id = "ATK-" + Math.floor(100000 + (subtotal*7 + total*13 + items.length*4099) % 900000);
          const ord = { id, total, email:f.email, method, last4: method==="card" ? f.card.replace(/\s/g,"").slice(-4) : "----", eta: "3–5 business days" };
          setOrder(ord);
          setStage("done");
          onSuccess(ord);
        }, 2400);

                    </>

    /* ---------------- App ---------------- */
    function App(){
      const [cat,setCat] = useState("All");
      const [sort,setSort] = useState("featured");
      const [cart,setCart] = useState([]);
      const [favs,setFavs] = useState([]);
      const [drawer,setDrawer] = useState(false);
      const [checkout,setCheckout] = useState(false);
      const { toasts, push } = useToasts();

      const shown = useMemo(()=>{
        let list = PRODUCTS.filter(p=> cat==="All" || p.cat===cat);
        if(sort==="low") list=[...list].sort((a,b)=>a.price-b.price);
        else if(sort==="high") list=[...list].sort((a,b)=>b.price-a.price);
        else if(sort==="rating") list=[...list].sort((a,b)=>b.rating-a.rating);
        return list;
      },[cat,sort]);

      const add = (p) => {
        setCart(c=>{
          const ex = c.find(x=>x.id===p.id);
          if(ex) return c.map(x=>x.id===p.id?{...x,qty:x.qty+1}:x);
          return [...c,{...p,qty:1}];
        });
        push(`Added “${p.name}”`);
      };
      const setQty = (id,q)=> setCart(c=> q<=0 ? c.filter(x=>x.id!==id) : c.map(x=>x.id===id?{...x,qty:q}:x));
      const remove = (id)=> setCart(c=>c.filter(x=>x.id!==id));
      const toggleFav = (id)=> setFavs(f=> f.includes(id)?f.filter(x=>x!==id):[...f,id]);

      const count = cart.reduce((a,b)=>a+b.qty,0);
      const subtotal = cart.reduce((a,b)=>a+b.price*b.qty,0);
      const shipping = subtotal>50 || subtotal===0 ? 0 : 4.99;
      const tax = +(subtotal*0.20).toFixed(2);
      const total = +(subtotal+shipping+tax).toFixed(2);

      const openCheckout = () => { setDrawer(false); setCheckout(true); };
      const onPaid = (ord) => { setCart([]); push("Payment complete ✓"); };

      return (
        <>
          {/* Nav */}
          <header className="nav">
            <div className="wrap nav-inner">
              <div className="logo"><span className="mark">C</span> ClickFR</div>
              <nav className="nav-links">
                <a href="#shop">Shop</a>
                <a href="#featured">Featured</a>
                <a href="#deals">Deals</a>
                <a href="#about">About</a>
              </nav>
              <div className="nav-right">
                <span className="pill" style={{color:"var(--muted)"}}>🚚 Free shipping over €50</span>
                <button className="cart-btn" onClick={()=>setDrawer(true)} title="Cart">
                  <Cart/>
                  {count>0 && <span className="cart-count">{count}</span>}
                </button>
              </div>
            </div>
          </header>

          {/* Hero */}
          <section className="hero">
            <div className="wrap hero-grid">
              <div>
                <span className="pill"><span style={{color:"var(--brand-2)"}}>✦</span> New arrivals every week</span>
                <h1>Everything you need,<br/><span className="g">one click away.</span></h1>
                <p>Phone accessories, Forever Living wellness, clothing and home essentials — curated and delivered fast. Free shipping over €50, easy returns, and a demo checkout you can try right now.</p>
                <div className="hero-cta">
                  <a href="#shop" className="btn btn-primary">Shop the collection →</a>
                  <a href="#deals" className="btn btn-ghost">View today's deals</a>
                </div>
                <div className="hero-stats">
                  <div className="s"><b>50k+</b><span>Happy customers</span></div>
                  <div className="s"><b>4.9★</b><span>Average rating</span></div>
                  <div className="s"><b>24/7</b><span>Support</span></div>
                </div>
              </div>
              <div className="hero-visual">
                <span className="float">🛍️</span>
                <div className="badge b1"><span className="dot"></span> In stock · ships today</div>
                <div className="badge b2">⭐ 4.9 · 12,480 reviews</div>
              </div>
            </div>
          </section>

          {/* Features */}
          <section className="wrap sec" id="about">
            <div className="feat">
              <div className="f"><span className="ic">🚚</span><div><b>Free fast shipping</b><span>On all orders over €50</span></div></div>
              <div className="f"><span className="ic">↩️</span><div><b>30-day returns</b><span>No questions asked</span></div></div>
              <div className="f"><span className="ic">🔒</span><div><b>Secure checkout</b><span>Encrypted demo payments</span></div></div>
              <div className="f"><span className="ic">🎁</span><div><b>2-year warranty</b><span>On every product</span></div></div>
            </div>
          </section>

          {/* Shop */}
          <section className="wrap sec" id="shop">
            <div className="sec-head">
              <div>
                <span className="eyebrow">Our collection</span>
                <h2>Shop everything</h2>
                <p>{shown.length} products · curated for the way you live</p>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:12,alignItems:"flex-end"}}>
                <div className="filters">
                  {CATEGORIES.map(c=>(
                    <button key={c} className={"chip"+(cat===c?" active":"")} onClick={()=>setCat(c)}>{c}</button>
                  ))}
                </div>
                <select className="inp" style={{width:"auto",padding:"9px 12px",cursor:"pointer"}} value={sort} onChange={e=>setSort(e.target.value)}>
                  <option value="featured">Sort: Featured</option>
                  <option value="low">Price: Low to High</option>
                  <option value="high">Price: High to Low</option>
                  <option value="rating">Top rated</option>
                </select>
              </div>
            </div>
            <div className="grid" id="featured">
              {shown.map(p=>(
                <ProductCard key={p.id} p={p} onAdd={add} fav={favs.includes(p.id)} onFav={toggleFav} />
              ))}
            </div>
          </section>

          {/* Deals banner */}
          <section className="wrap sec" id="deals">
            <div style={{
              borderRadius:22,padding:"38px 40px",border:"1px solid var(--line-2)",
              background:"radial-gradient(120% 140% at 100% 0%,rgba(124,92,255,.35),transparent 55%),radial-gradient(120% 140% at 0% 100%,rgba(34,211,238,.28),transparent 55%),var(--panel)",
              display:"flex",alignItems:"center",justifyContent:"space-between",gap:24,flexWrap:"wrap"
            }}>
              <div>
                <span className="eyebrow">Limited time</span>
                <h2 style={{fontSize:28,margin:"8px 0 6px",fontWeight:800}}>Up to 30% off phone accessories 📱</h2>
                <p style={{color:"var(--muted)",margin:0,maxWidth:440}}>Save on cables, chargers, power banks and cases. Deals end soon — add to cart and check out with the demo payment.</p>
              </div>
              <button className="btn btn-primary" onClick={()=>{setCat("Phone Accessories");document.getElementById("shop").scrollIntoView({behavior:"smooth"});}}>Shop accessory deals →</button>
            </div>
          </section>

          {/* Footer */}
          <footer>
            <div className="wrap">
              <div className="foot-grid">
                <div>
                  <div className="logo" style={{marginBottom:12}}><span className="mark">C</span> ClickFR</div>
                  <p style={{fontSize:13.5,maxWidth:300,margin:0}}>Phone accessories, wellness, clothing &amp; home essentials — all in one place. This is a demo store built for showcase purposes.</p>
                  <div style={{display:"flex",gap:10,marginTop:16,fontSize:20}}>
                    <span>📸</span><span>🐦</span><span>▶️</span><span>💼</span>
                  </div>
                </div>
                <div><h4>Shop</h4><ul><li><a href="#shop">All products</a></li><li><a href="#deals">Deals</a></li><li><a href="#shop">Phone Accessories</a></li><li><a href="#shop">Clothing</a></li></ul></div>
                <div><h4>Support</h4><ul><li><a href="#">Contact us</a></li><li><a href="#">Shipping</a></li><li><a href="#">Returns</a></li><li><a href="#">Warranty</a></li></ul></div>
                <div><h4>Company</h4><ul><li><a href="#">About</a></li><li><a href="#">Careers</a></li><li><a href="#">Press</a></li><li><a href="#">Privacy</a></li></ul></div>
              </div>
              <div className="foot-bottom">
                <span>© 2026 ClickFR. All rights reserved · Demo store.</span>
                <span style={{display:"flex",gap:10,alignItems:"center"}}>We accept: 💳 VISA · Mastercard · 🅿️ PayPal ·  Pay</span>
              </div>
            </div>
          </footer>

          {/* Drawer + Checkout + Toasts */}
          <Drawer open={drawer} onClose={()=>setDrawer(false)} items={cart} setQty={setQty} remove={remove}
                  subtotal={subtotal} shipping={shipping} tax={tax} total={total} onCheckout={openCheckout}/>
          <Checkout open={checkout} onClose={()=>setCheckout(false)} items={cart}
                    subtotal={subtotal} shipping={shipping} tax={tax} total={total} onSuccess={onPaid}/>
          <div className="toasts">
            {toasts.map(t=>(
              <div className="toast" key={t.id}><span className="ti">✓</span>{t.msg}</div>
            ))}
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
